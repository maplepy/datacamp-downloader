[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "datacamp-downloader-reborn"
version = "4.0.3"
description = "Download and organize DataCamp course materials by ID or slug."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mohammad Al-Fetyani", email = "m4bh@hotmail.com" },
]
dependencies = [
    "beautifulsoup4==4.13.5",
    "requests==2.32.5",
    "selenium==4.35.0",
    "undetected-chromedriver==3.2.1",
    "texttable==1.6.3",
    "termcolor==1.1.0",
    "colorama==0.4.4",
    "tomd==0.1.3",
    "typer==0.3.2",
]

[project.urls]
Homepage = "https://github.com/maplepy/datacamp-downloader"
Repository = "https://github.com/maplepy/datacamp-downloader"
Issues = "https://github.com/maplepy/datacamp-downloader/issues"

[project.scripts]
datacamp = "datacamp_downloader.downloader:app"

[tool.setuptools.packages.find]
where = ["src"]
